<div class="portfolio">
  <div (click)="closeLayer() " class="fixed layer-img flex justify-center items-center" [class.hidden]="openSlide">
    <div (click)='$event.stopPropagation()' class="img-me">

      <img [src]="isSelected">
    </div>
  </div>
  <div class="container ">
    <div class="content-portfolio py-6 relative">

      <p class="uppercase text-4xl text-center font-bold mt-6">portfolio component</p>
                  <div class="line flex flex-row m-auto w-fit mt-4 mb-7">
    <div class="f-line "></div>
    <i class="fa-solid fa-star "></i>
    <div class="sec-line"></div>
</div>

      <div class="grid grid-cols-3 gap-11 ">
        @for(image of imageArr;track $index){
        <div (click)="openPhoto($index)" class="">
          <div class="relative shadow-lg ">
            <img [src]="image.imageUrl" class="rounded-md" [alt]="image.imageAlt">
            <div class="layer text-center text-white rounded"><i class="fa-solid fa-plus"></i></div>
          </div>
        </div>
        }


      </div>
    </div>


  </div>
</div>
